<!-- @dsCard height=300 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
body { margin: 0; background: var(--background-canvas); }
.cover { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--background-canvas); }
.cover svg { position: absolute; inset: 0; }
.purple { fill: var(--color-purple); }
.tint { fill: var(--color-purple-tint); }
.ink { fill: var(--color-ink); }
.surface { fill: var(--color-surface-strong); }
.block { rx: var(--radius-control); }
.chip { rx: var(--radius-badge); }
.rule { stroke: var(--color-rule); stroke-width: 1px; }
.name { position: absolute; left: 40px; bottom: 66px; margin: 0; font: 700 96px/0.95 var(--font-body); letter-spacing: -3px; color: var(--text-primary); }
.tag { position: absolute; left: 40px; bottom: 32px; margin: 0; max-width: 440px; font: 400 14px/1.4 var(--font-body); color: var(--text-secondary); }
</style>
</head>
<body>
<div class="cover">
<svg viewBox="0 0 960 300" width="960" height="300" aria-hidden="true">
<!--
blocks: color-purple 144x120 bleeding off the right edge, color-purple-tint 432x60 (one ledger row high, row-height), color-ink 72x24 and color-surface-strong 96x24 (badge height)
arrangement: one tinted "current row" band across the ledger with the purple action slab stacked above it at the right, small chips sitting on the rows like status badges
pattern: five hairline rules at the row-height pitch (60px), chosen because the README says thin grey rules make the cells of the ledger
steps and radii: pitch 60px (row-height), insets 16/24px (space-16, space-24), radius-control on blocks, radius-badge on chips
-->
<rect class="tint" x="504" y="120" width="456" height="60"/>
<rect class="purple block" x="792" y="36" width="192" height="60"/>
<line class="rule" x1="504" y1="60" x2="960" y2="60"/>
<line class="rule" x1="504" y1="120" x2="960" y2="120"/>
<line class="rule" x1="504" y1="180" x2="960" y2="180"/>
<line class="rule" x1="504" y1="240" x2="960" y2="240"/>
<line class="rule" x1="504" y1="0" x2="504" y2="300"/>
<rect class="ink chip" x="528" y="78" width="72" height="24"/>
<rect class="surface chip" x="616" y="78" width="96" height="24"/>
<rect class="purple chip" x="528" y="138" width="48" height="24"/>
<rect class="surface chip" x="528" y="198" width="144" height="24"/>
<rect class="surface chip" x="840" y="198" width="72" height="24"/>
<rect class="ink chip" x="528" y="258" width="96" height="24"/>
</svg>
<p class="name">DDoukD</p>
<p class="tag">운동샵의 회원, 회원권, 예약을 적는 장부</p>
</div>
</body>
</html>
