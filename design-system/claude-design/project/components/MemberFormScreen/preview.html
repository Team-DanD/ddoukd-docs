<!-- @dsCard group="Screens" height=860 subtitle="회원 등록" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
body { margin: 0; padding: 24px; background: var(--background-canvas); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
.col { display: flex; flex-direction: column; gap: 16px; }
.note { margin: 0; font: 400 12px/1.4 var(--font-body); color: var(--text-secondary); }
.phone { width: 390px; max-width: 100%; border: 1px solid var(--border-strong); }
</style>
</head>
<body>
<div class="dd">
<div class="phone dd-screen" style="height: 800px;">
<header class="dd-topbar dd-topbar--rule"><button class="dd-iconbtn" type="button" aria-label="뒤로"><svg class="dd-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><h1 class="dd-topbar__title dd-topbar__title--sub">회원 등록</h1></header>
<div class="dd-screen__body dd-screen__pad">
<div class="dd-formfield"><label class="dd-label" for="s-name">이름</label><div class="dd-field"><input id="s-name" type="text" placeholder="이름"></div></div>
<div class="dd-formfield"><label class="dd-label" for="s-tel">전화번호</label><div class="dd-field dd-field--error"><input id="s-tel" type="tel" value="010-1234" aria-invalid="true" aria-describedby="s-tel-err"></div><p class="dd-error" id="s-tel-err"><svg class="dd-icon dd-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>숫자만 10~11자리로 입력해주세요</p></div>
<div class="dd-formfield"><label class="dd-label" for="s-plan">회원권</label><div class="dd-field"><select id="s-plan"><option>10회권</option><option>20회권</option><option>체험 1회</option></select><svg class="dd-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div><p class="dd-help">회원권 정책은 설정에서 바꿀 수 있어요</p></div>
<div class="dd-formrow">
<div class="dd-formfield"><label class="dd-label" for="s-start">시작일</label><div class="dd-field"><input id="s-start" type="text" value="2026-10-05"></div></div>
<div class="dd-formfield"><label class="dd-label" for="s-end">만료일</label><div class="dd-field dd-field--readonly"><input id="s-end" type="text" value="2027-01-05" readonly></div></div>
</div>
<div class="dd-formfield"><label class="dd-label" for="s-memo">메모 <small>(선택)</small></label><div class="dd-field dd-field--textarea"><textarea id="s-memo" placeholder="허리 통증 이력, 선호 시간대 등"></textarea></div></div>
</div>
<div class="dd-actionbar"><button class="dd-btn dd-btn--secondary" type="button">그만두기</button><button class="dd-btn" type="button">저장</button></div>
</div>
</div>
</body>
</html>
